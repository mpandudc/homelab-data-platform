name: ${COMPOSE_PROJECT_NAME:-data-platform}

# Target state for Proxmox LXC 206 `data` (4 vCPU, 8 GB). Profiles let the
# box run only what is needed:
#   core           MinIO + ClickHouse (+ bucket bootstrap)
#   stream         Redpanda
#   orchestration  Airflow (LocalExecutor) + shared Postgres
#   bi             Metabase (+ shared Postgres)
# Sum of mem_limit across long-running services is kept <= 6 GiB, enforced by
# scripts/check_project.py.

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true

x-restart: &restart
  restart: unless-stopped

x-airflow-common: &airflow-common
  # apache/airflow:2.10.5 + dbt-clickhouse in its own venv + the dbt project at a
  # pinned commit (airflow/Dockerfile), so trade_marts_daily can run here.
  build: ./airflow
  image: local/platform-airflow:2.10.5
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?}@platform-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?}
    # One gunicorn worker: two sat at 763/768 MiB in verification (OOM risk).
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PLATFORM_CLICKHOUSE_URL: http://clickhouse:8123
    PLATFORM_MINIO_URL: http://minio:9000
    PLATFORM_REDPANDA_ADMIN_URL: http://redpanda:9644
    PLATFORM_METABASE_URL: http://metabase:3000
    # trade_marts_daily: ClickHouse as the scoped dbt user; databases are
    # provisioned by clickhouse/init, so the DAG must not CREATE DATABASE.
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_HTTP_PORT: "8123"
    CLICKHOUSE_USER: dbt
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_DBT_PASSWORD:?}
    PLATFORM_MANAGED_DATABASES: "1"
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  <<: *common-security

services:
  # ---------------------------------------------------------------- core
  # MinIO no longer publishes release-tagged images, so the image is pinned by
  # digest (RELEASE.2025-09-07T16-13-09Z, the build already running on LXC 206).
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    profiles: [core]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    <<: [*common-security, *restart]

  minio-init:
    image: ${MINIO_IMAGE:-quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    profiles: [core]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      CH_BACKUP_ACCESS_KEY: ${CH_BACKUP_ACCESS_KEY:?}
      CH_BACKUP_SECRET_KEY: ${CH_BACKUP_SECRET_KEY:?}
    volumes:
      - ./minio:/bootstrap:ro
    entrypoint: ["/bin/sh", "/bootstrap/init.sh"]
    <<: *common-security

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.8}
    profiles: [core]
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_DBT_PASSWORD: ${CLICKHOUSE_DBT_PASSWORD:?}
      CLICKHOUSE_METABASE_PASSWORD: ${CLICKHOUSE_METABASE_PASSWORD:?}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9009}:9000"
      - "${CLICKHOUSE_METRICS_PORT:-9363}:9363"
    volumes:
      - ./clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # 167 MiB idle in verification; 1.25 GiB keeps the 6.5 GiB budget with dbt in the scheduler.
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    <<: [*common-security, *restart]

  # -------------------------------------------------------------- stream
  redpanda:
    image: redpandadata/redpanda:${REDPANDA_VERSION:-v26.2.3}
    profiles: [stream]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://${PLATFORM_HOST:-localhost}:${REDPANDA_KAFKA_PORT:-19092}
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    <<: [*common-security, *restart]

  redpanda-console:
    image: redpandadata/console:${REDPANDA_CONSOLE_VERSION:-v3.12.0}
    profiles: [stream]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./redpanda-console/config.yaml:/etc/console/config.yaml:ro
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8088}:8080"
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    <<: [*common-security, *restart]

  # ---------------------------------------------------------------- docs
  dbt-docs:
    build:
      context: ./dbt-docs
      args:
        DBT_MARTS_REF: ${DBT_MARTS_REF:-49d9f4977d3efb4827049cd70c175401ae2eccc2}
    image: local/dbt-docs:${DBT_MARTS_REF:-49d9f4977d3efb4827049cd70c175401ae2eccc2}
    profiles: [docs]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: dbt
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_DBT_PASSWORD:?}
    ports:
      - "${DBT_DOCS_PORT:-8081}:8080"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 15s
      timeout: 5s
      retries: 40
    <<: [*common-security, *restart]

  # ---------------------------------------------------------------- edge
  # Publishes the web UIs on *.cahyo.tech through an outbound-only Cloudflare
  # Tunnel. Every hostname must sit behind a Cloudflare Access policy; see
  # edge/README.md. Needs edge/config.yml and edge/<tunnel-id>.json (gitignored).
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.9.3}
    profiles: [edge]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./edge:/etc/cloudflared:ro
    mem_limit: 64m
    <<: [*common-security, *restart]

  # ------------------------------------------------- orchestration + bi
  platform-db:
    image: postgres:16-alpine
    profiles: [orchestration, bi]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - platform-db:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    <<: [*common-security, *restart]

  airflow-init:
    <<: *airflow-common
    profiles: [orchestration]
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      <<: *airflow-env
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?}
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && (airflow users create --role Admin --username admin --firstname Admin
        --lastname User --email admin@localhost --password "$${_AIRFLOW_WWW_USER_PASSWORD}" || true)

  airflow-webserver:
    <<: [*airflow-common, *restart]
    profiles: [orchestration]
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    # Verification: webserver ~766 MiB steady even with one worker.
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20

  airflow-scheduler:
    <<: [*airflow-common, *restart]
    profiles: [orchestration]
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    # LocalExecutor runs dbt inside this container; ~430 MiB idle, dbt adds ~300.
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8974/health"]
      interval: 15s
      timeout: 5s
      retries: 20

  metabase:
    image: metabase/metabase:${METABASE_VERSION:-v0.63.19.1}
    profiles: [bi]
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: platform-db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      # Heap 512m leaves room for metaspace/threads; 640m filled the 1 GiB limit.
      # Do not cap metaspace: 192m crash-looped Metabase on start.
      JAVA_OPTS: -Xmx512m -XX:+UseSerialGC
    ports:
      - "${METABASE_PORT:-3000}:3000"
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 40
    <<: [*common-security, *restart]

volumes:
  minio-data:
  clickhouse-data:
  redpanda-data:
  platform-db:
  airflow-logs:
