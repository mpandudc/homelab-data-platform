# Append under scrape_configs in Prometheus on LXC 207 `monitoring`
# (see the vault note homelab-observability-monitoring). 192.168.0.119 is LXC 206.
- job_name: clickhouse
  static_configs:
    - targets: ["192.168.0.119:9363"]
      labels: {lxc: "206", service: clickhouse}

- job_name: redpanda
  metrics_path: /public_metrics
  static_configs:
    - targets: ["192.168.0.119:9644"]
      labels: {lxc: "206", service: redpanda}

- job_name: minio
  metrics_path: /minio/v2/metrics/cluster
  static_configs:
    - targets: ["192.168.0.119:9000"]
      labels: {lxc: "206", service: minio}
